<style>
    /* Removes browser default 8px margin */
    body {
        margin: 0;
    }

    /* Canvas is display: inline by default, inline sits on the text baseline, causing extra pixels below the text baseline */
    canvas {
        display: block;
        background: black;
    }

    #restart {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
</style>

<canvas id="maincanvas"></canvas>
<button id="restart" hidden>Restart</button>
<script src="game.js"></script>
